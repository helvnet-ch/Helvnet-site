server {
    listen 80;
    listen [::]:80;
    server_name helvnet.ch www.helvnet.ch;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/helvnet-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/helvnet-redirects.conf;
    location / { return 301 https://helvnet.ch$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.helvnet.ch;
    ssl_certificate /etc/letsencrypt/live/helvnet.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helvnet.ch/privkey.pem;

    include /etc/nginx/snippets/helvnet-redirects.conf;
    location / { return 301 https://helvnet.ch$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name helvnet.ch;
    ssl_certificate /etc/letsencrypt/live/helvnet.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helvnet.ch/privkey.pem;
    root @RELEASE_ROOT@;

    add_header X-Helvnet-Origin keywest always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;

    include /etc/nginx/snippets/helvnet-redirects.conf;
@CANONICAL_LOCATIONS@
    location = /404.html { internal; }
    location / { try_files $uri =404; }
}
