<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="demande-devis" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="demande-devis">
      <input name="bot-field" type="text">
      <input name="nom" type="text">
      <input name="telephone" type="tel">
      <input name="email" type="email">
      <input name="commune" type="text">
      <input name="service" type="text">
      <input name="delai" type="text">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
